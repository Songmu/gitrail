name: release
description: release gitrail
inputs:
  tag:
    description: tag name to be released
    default: ''
  token:
    description: GitHub token
    required: true
runs:
  using: composite
  steps:
  - name: setup go
    uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
    with:
      go-version: stable
  - name: release
    run: |
      make crossbuild
    shell: bash
    env:
      GITHUB_TOKEN: ${{ inputs.token }}
  - uses: tcnksm/ghr@6d5050722b6019e8a5a4bdb67a0fa8b05fe330e9 # v0.18.0
    with:
      tag_name: ${{ inputs.tag }}
      token: ${{ inputs.token }}
      path: "dist"
