name: release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: verify tag commit is on main
      shell: bash
      run: |
        tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
        if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
          echo "::error title=Invalid release tag::$GITHUB_REF_NAME does not point to a commit on main"
          exit 1
        fi

  build:
    needs: validate-tag
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: $/.github/workflows/release-build.yaml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-${{ github.ref_name }}
        path: release
    - name: publish GitHub release
      uses: tcnksm/ghr@43083d3bbef04a78a967370c11cc760fe19badb6 # v0.18.5
      with:
        owner: ${{ github.repository_owner }}
        repository: ${{ github.event.repository.name }}
        tag: ${{ github.ref_name }}
        token: ${{ github.token }}
        path: release
        # Preserve an existing draft release instead of overwriting it. This is
        # required when release.yaml is dispatched directly via workflow_dispatch.
        generatenotes: true
    - name: update major version tag
      uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1.5.1
      with:
        github_token: ${{ github.token }}
        tag: ${{ github.ref_name }}
        major_version_tag_only: true
