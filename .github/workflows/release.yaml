name: release

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release; run the workflow with the same tag as its ref
        required: true
        type: string

jobs:
  release:
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-reusable.yaml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
