name: tagpr
on:
  push:
    branches:
    - "main"
  workflow_dispatch:

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: tagpr
      id: tagpr
      uses: Songmu/tagpr@bca0c78861c25f5b38f97f11e73b67c9b01b3aef # v1.20.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: dispatch release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.tagpr.outputs.tag }}
      run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
