name: release build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: validate release ref
      id: release
      run: |
        if [[ "$GITHUB_REF_TYPE" != "tag" ||
              ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::release workflow must run from a semantic-version tag"
          exit 1
        fi

        echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
    - name: prepare release build
      id: build
      run: |
        echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    - name: build release archives
      id: goxz
      uses: Songmu/goxz@ca593d878bfc0fe683ab80243fad53aeef4bcbfd # v0.11.1
      with:
        package-version: ${{ steps.release.outputs.tag }}
        os: linux,darwin
        packages: ./cmd/gitrail
        build-ldflags: -s -w -X github.com/Songmu/gitrail.revision=${{ steps.build.outputs.revision }}
    - name: generate checksums
      env:
        OUTPUT_DIR: ${{ steps.goxz.outputs.output-dir }}
      run: |
        cd "$OUTPUT_DIR"
        shasum -a 256 -- * > SHA256SUMS
    - name: attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: "${{ steps.goxz.outputs.output-dir }}/*"
    - name: upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-${{ steps.release.outputs.tag }}
        path: "${{ steps.goxz.outputs.output-dir }}/*"
        if-no-files-found: error
        retention-days: 1
