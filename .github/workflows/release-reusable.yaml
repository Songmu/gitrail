name: reusable release

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: resolve and validate release tag
      id: release
      run: |
        resolved_tag="$(
          git tag --points-at "$GITHUB_SHA" |
            awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
        )"
        if [[ ! "$resolved_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::expected a semantic-version release tag for $GITHUB_SHA"
          exit 1
        fi

        echo "tag=$resolved_tag" >> "$GITHUB_OUTPUT"
    - name: setup go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
    - name: prepare release build
      id: build
      run: |
        echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    - name: build release archives
      id: goxz
      uses: Songmu/goxz@ca593d878bfc0fe683ab80243fad53aeef4bcbfd # v0.11.1
      with:
        package-version: ${{ steps.release.outputs.tag }}
        os: linux,darwin
        packages: ./cmd/gitrail
        build-ldflags: -s -w -X github.com/Songmu/gitrail.revision=${{ steps.build.outputs.revision }}
    - name: generate checksums
      env:
        OUTPUT_DIR: ${{ steps.goxz.outputs.output-dir }}
      run: |
        cd "$OUTPUT_DIR"
        shasum -a 256 -- * > SHA256SUMS
    - name: attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: "${{ steps.goxz.outputs.output-dir }}/*"
    - name: upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-${{ steps.release.outputs.tag }}
        path: "${{ steps.goxz.outputs.output-dir }}/*"
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
    - name: download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-${{ needs.build.outputs.tag }}
        path: release
    - name: publish GitHub release
      uses: tcnksm/ghr@766f869eacbbb086e8860cf0f0192dda6e8e67e1 # v0.18.3
      with:
        owner: ${{ github.repository_owner }}
        repository: ${{ github.event.repository.name }}
        tag: ${{ needs.build.outputs.tag }}
        token: ${{ github.token }}
        path: release
