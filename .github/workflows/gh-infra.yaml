name: gh-infra

on:
  push:
    branches:
    - main
    paths:
    - .github/infra.yaml
    - .github/workflows/gh-infra.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: install gh-infra
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh extension install babarot/gh-infra --pin v0.13.0
    - name: apply repository settings
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh infra apply .github/infra.yaml --auto-approve
